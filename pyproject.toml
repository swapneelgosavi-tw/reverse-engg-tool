[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rev-tool"
version = "0.1.0"
description = "Deterministic (no-LLM) API request/response and sequence-diagram extraction for Java/Spring and React/TS codebases"
requires-python = ">=3.11"
dependencies = [
    "ladybug==0.22.3",
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "pyyaml>=6.0",
]

[project.scripts]
rev-tool = "rev_tool.cli:main"

[tool.setuptools.packages.find]
include = ["rev_tool*"]
